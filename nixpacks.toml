[phases.setup]
nixPkgs = ['php83', 'php83Packages.composer', 'php83Extensions.intl', 'php83Extensions.gd', 'php83Extensions.bcmath', 'php83Extensions.zip', 'php83Extensions.pdo_mysql', 'nodejs']

[phases.build]
cmds = ['composer install --no-dev --optimize-autoloader', 'npm install', 'npm run build']

[start]
cmd = 'php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000'
